name: Collect Coding Prowess Data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 1 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Collect data
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          LC_USERNAME: ${{ secrets.LC_USERNAME }}
        run: |
          if [ -z "$GH_USERNAME" ] && [ -z "$LC_USERNAME" ]; then
            echo "Both GH_USERNAME and LC_USERNAME are empty. Add repository secrets or data/profile.json." >&2
            exit 1
          fi
          npm run prowess:collect

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/github.json data/leetcode.json || true
            git commit -m "chore(prowess): update collected data [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

